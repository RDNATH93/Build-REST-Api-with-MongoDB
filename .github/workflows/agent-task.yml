on:
  workflow_dispatch: 

permissions: 
   contents: read
   issues: write
   copilot-requests: write 
jobs: 
  agent-task: 
    runs-on: ubuntu-latest
    env:
     COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4
      
      - name: Agent Task - Review for vulnerabilities
        run: |
          npx @github/copilot \
          -p "Review code and dependencies for vulnerabilities and create issue" \
          --no-ask-user \
          --allow-tool shell \
          --allow-url api.github.com
          
